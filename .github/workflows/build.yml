name: Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - "data/**"
      - "model/**"
      - "pbip/**"
      - "powerquery/**"
      - "theme/**"
      - "src/**"
      - "build/**"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj

      - name: Build Solution
        run: dotnet build src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj --configuration Release --no-restore

      - name: Run Tests with Coverage
        run: >
          dotnet build tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj --configuration Release
          && dotnet test tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"

      - name: Validate project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/validate.ps1

      - name: Generate PBIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logDirectory = Join-Path $PWD "build-logs"
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          $logPath = Join-Path $logDirectory "generate-pbip.log"

          if (Test-Path $logPath) {
              Remove-Item $logPath -Force
          }

          try {
              & {
                  ./build/build.ps1
              } *>&1 | Tee-Object -FilePath $logPath

              if ($LASTEXITCODE -ne 0) {
                  throw "Generate PBIP failed with exit code $LASTEXITCODE. See $logPath."
              }
          }
          catch {
              $_ | Format-List * -Force | Out-String | Tee-Object -FilePath $logPath -Append | Write-Host
              throw
          }

      - name: Verify Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "artifacts")) {
              throw "artifacts folder was not created."
          }

          Get-ChildItem artifacts -Recurse

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBIP-Build
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            build-logs/**
            **/*.log
            **/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
