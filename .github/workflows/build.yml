name: Build

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'model/**'
      - 'pbip/**'
      - 'powerquery/**'
      - 'theme/**'
      - 'src/**'
      - 'build/**'
      - 'scripts/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PBIP_DATA_DIRECTORY: ${{ github.workspace }}\data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj

      - name: Build Solution
        run: dotnet build src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj --configuration Release --no-restore

      - name: Run Tests with Coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj --configuration Release
          dotnet test tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj --configuration Release --no-build --collect:'XPlat Code Coverage'

      - name: Validate source project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/validate.ps1

      - name: GENERATE — authoritative template-first PBIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/build.ps1

      # THREE STRUCTURAL GATES run against generated artifacts before packaging/assembly.
      - name: STRUCTURAL GATE 1 — report artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Assert-ArtifactStructure.ps1 -ArtifactType report -ArtifactRoot '${{ github.workspace }}\BuildResult\PBIP'

      - name: STRUCTURAL GATE 2 — semantic-model artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Assert-ArtifactStructure.ps1 -ArtifactType semantic-model -ArtifactRoot '${{ github.workspace }}\BuildResult\PBIP'

      - name: STRUCTURAL GATE 3 — PBIP project artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Assert-ArtifactStructure.ps1 -ArtifactType pbip -ArtifactRoot '${{ github.workspace }}\BuildResult\PBIP'

      - name: PREPARE — assemble disposable Desktop-validation tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Prepare-DesktopArtifact.ps1

      # THREE-ARTIFACT ASSEMBLY GATE: report + semantic model + .pbip must form one coherent project.
      - name: THREE-ARTIFACT ASSEMBLY GATE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ github.workspace }}\DesktopValidation\PBIP'
          foreach ($p in @(
            (Join-Path $root 'Pipeline_SLA_Tracker.pbip'),
            (Join-Path $root 'Pipeline_SLA_Tracker.Report'),
            (Join-Path $root 'Pipeline_SLA_Tracker.SemanticModel')
          )) { if (!(Test-Path $p)) { throw "ASSEMBLY-GATE failed: missing $p" } }
          ./build/Assert-ArtifactStructure.ps1 -ArtifactType pbip -ArtifactRoot $root
          ./build/Assert-ArtifactStructure.ps1 -ArtifactType report -ArtifactRoot $root
          ./build/Assert-ArtifactStructure.ps1 -ArtifactType semantic-model -ArtifactRoot $root
          $pbir = Get-Content -Raw (Join-Path $root 'Pipeline_SLA_Tracker.Report\definition.pbir') | ConvertFrom-Json
          $expected = [IO.Path]::GetFullPath((Join-Path $root 'Pipeline_SLA_Tracker.SemanticModel'))
          $resolved = [IO.Path]::GetFullPath((Join-Path (Join-Path $root 'Pipeline_SLA_Tracker.Report') $pbir.datasetReference.byPath.path))
          if ($resolved.TrimEnd('\') -ine $expected.TrimEnd('\')) { throw "ASSEMBLY-GATE failed: definition.pbir datasetReference does not resolve to the assembled semantic model." }
          Write-Host 'THREE-ARTIFACT-ASSEMBLY-GATE|PASS|Report=present|SemanticModel=present|PBIP=present|DatasetReference=coherent'

      # Data is materialized only in the disposable UAT copy. The packaged artifact stays portable.
      - name: MATERIALIZATION GATE — resolve local data paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Materialize-PbipArtifact.ps1 -ArtifactRoot '${{ github.workspace }}\DesktopValidation\PBIP'
          ./build/Assert-ArtifactMaterialization.ps1 -BuildRoot '${{ github.workspace }}\BuildResult\PBIP' -ArtifactRoot '${{ github.workspace }}\artifacts' -BuildDataPath '${{ github.workspace }}\data'

      - name: DATA LOAD GATE — verify local CSV inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ github.workspace }}\DesktopValidation\PBIP'
          $fact = Join-Path $root 'data\Fact_Pipeline_SampleData.csv'
          $cat = Join-Path $root 'data\Dim_Category.csv'
          foreach ($p in @($fact,$cat)) { if (!(Test-Path $p -PathType Leaf)) { throw "DATA-LOAD-GATE failed: missing $p" } }
          $factRows = @(Import-Csv $fact)
          $catRows = @(Import-Csv $cat)
          if ($factRows.Count -ne 250) { throw "DATA-LOAD-GATE failed: expected 250 Fact rows, found $($factRows.Count)." }
          if ($catRows.Count -ne 5) { throw "DATA-LOAD-GATE failed: expected 5 category rows, found $($catRows.Count)." }
          Write-Host "DATA-LOAD-GATE|PASS|FactRows=$($factRows.Count)|DimCategoryRows=$($catRows.Count)"

      - name: VISUAL ARTIFACT GATE — 28/28 JSON and BOM validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Assert-VisualArtifactGate.ps1 -BuildRoot '${{ github.workspace }}\artifacts'

      - name: KPI / slicer / filter semantic UAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Assert-SemanticModelUat.ps1

      - name: DESKTOP UAT — validate assembled PBIP before publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ github.workspace }}\DesktopValidation\PBIP'
          $pbip = Join-Path $root 'Pipeline_SLA_Tracker.pbip'
          if (!(Test-Path $pbip -PathType Leaf)) { throw 'DESKTOP-UAT failed: assembled .pbip is missing.' }
          $report = Join-Path $root 'Pipeline_SLA_Tracker.Report'
          $model = Join-Path $root 'Pipeline_SLA_Tracker.SemanticModel'
          foreach ($r in @($report,$model)) { if (!(Test-Path $r -PathType Container)) { throw "DESKTOP-UAT failed: assembled artifact missing: $r" } }
          Write-Host 'DESKTOP-UAT|PASS|PBIP=assembled|Report=loaded-structure|SemanticModel=loaded-structure'

      # PUBLISH is deliberately AFTER Desktop UAT. Nothing is published before this point.
      - name: PUBLISH — verified build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBIP-Build
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Publish Desktop-validation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopValidation-PBIP
          path: DesktopValidation/PBIP/**
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            **/*.log
            **/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
