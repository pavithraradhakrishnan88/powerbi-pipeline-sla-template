name: Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - "data/**"
      - "model/**"
      - "pbip/**"
      - "powerquery/**"
      - "theme/**"
      - "src/**"
      - "build/**"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # CI validates against the checkout-local data directory. The authoritative
      # template remains path-free; a developer running build.ps1 locally uses the
      # local repository data directory instead.
      PBIP_DATA_DIRECTORY: ${{ github.workspace }}\data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj

      - name: Build Solution
        run: dotnet build src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj --configuration Release --no-restore

      - name: Run Tests with Coverage
        run: >
          dotnet build tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj --configuration Release
          && dotnet test tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"

      - name: Validate project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/validate.ps1

      - name: Generate PBIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/build.ps1

      - name: Assert exact generated artifact materialization
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Assert-ArtifactMaterialization.ps1

      - name: Semantic-model KPI and slicer/filter UAT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Assert-SemanticModelUat.ps1

      - name: Verify Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "artifacts")) {
              throw "artifacts folder was not created."
          }

          Get-ChildItem artifacts -Recurse

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBIP-Build
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            **/*.log
            **/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
