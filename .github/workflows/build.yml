name: Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - "data/**"
      - "model/**"
      - "pbip/**"
      - "powerquery/**"
      - "theme/**"
      - "src/**"
      - "build/**"
      - "scripts/**"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PBIP_DATA_DIRECTORY: ${{ github.workspace }}\data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj

      - name: Build Solution
        run: dotnet build src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj --configuration Release --no-restore

      - name: Run Tests with Coverage
        run: >
          dotnet build tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj --configuration Release
          && dotnet test tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"

      - name: Validate project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/validate.ps1

      - name: Generate PBIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/build.ps1

      - name: Prepare Desktop-consumable artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Prepare-DesktopArtifact.ps1

      # STEP 1: Resolve the shared DataFolder expression and materialize the
      # disposable Desktop-validation copy to the local data folder.
      - name: "STEP 1 - Load data from data folder using materialization"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $desktopRoot = "${{ github.workspace }}\DesktopValidation\PBIP"
          ./build/Materialize-PbipArtifact.ps1 -ArtifactRoot $desktopRoot
          if (!(Test-Path "$desktopRoot\data\Fact_Pipeline_SampleData.csv" -PathType Leaf)) {
            throw "Materialized data load failed: Fact_Pipeline_SampleData.csv is missing."
          }
          Write-Host "DATA-LOAD-STEP|PASS|Materialization=PASS|FactCsv=PASS|DataFolderReferences=0" -ForegroundColor Green

      # STEP 2: Only after STEP 1 succeeds, verify the loaded tables/data and
      # then validate the visual definitions that consume those tables.
      # GitHub Actions cannot drive the Power BI Desktop UI itself, so this is
      # the CI equivalent of the post-refresh visual trigger: table data is
      # loaded/verified first, then every visual artifact is parsed and checked.
      - name: "STEP 2 - Refresh tables and trigger visual validation"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $desktopRoot = "${{ github.workspace }}\DesktopValidation\PBIP"
          $dataRoot = Join-Path $desktopRoot "data"
          $semanticRoot = Join-Path $desktopRoot "Pipeline_SLA_Tracker.SemanticModel"
          $reportRoot = Join-Path $desktopRoot "Pipeline_SLA_Tracker.Report"

          $factCsv = Join-Path $dataRoot "Fact_Pipeline_SampleData.csv"
          $categoryCsv = Join-Path $dataRoot "Dim_Category.csv"
          foreach ($csv in @($factCsv, $categoryCsv)) {
            if (!(Test-Path $csv -PathType Leaf)) { throw "Loaded table source is missing: $csv" }
          }

          $factRows = @(Import-Csv -LiteralPath $factCsv).Count
          $categoryRows = @(Import-Csv -LiteralPath $categoryCsv).Count
          if ($factRows -le 0) { throw "Fact table refresh gate failed: zero Fact rows loaded." }
          if ($categoryRows -le 0) { throw "Dimension table refresh gate failed: zero Dim_Category rows loaded." }

          $factTmdl = Join-Path $semanticRoot "definition\tables\Fact_Pipeline_SampleData.tmdl"
          $categoryTmdl = Join-Path $semanticRoot "definition\tables\Dim_Category.tmdl"
          $factPath = [IO.Path]::GetFullPath($factCsv)
          $categoryPath = [IO.Path]::GetFullPath($categoryCsv)
          $factText = Get-Content -Raw $factTmdl
          $categoryText = Get-Content -Raw $categoryTmdl
          if ($factText -notmatch [regex]::Escape($factPath)) { throw "Fact table is not bound to the loaded materialized CSV." }
          if ($categoryText -notmatch [regex]::Escape($categoryPath)) { throw "Dim_Category table is not bound to the loaded materialized CSV." }

          Write-Host "TABLE-REFRESH-GATE|PASS|FactRows=$factRows|DimCategoryRows=$categoryRows" -ForegroundColor Green

          $visualFiles = @(Get-ChildItem $reportRoot -Recurse -Filter "visual.json" -File)
          if ($visualFiles.Count -ne 28) { throw "Visual trigger gate failed: expected 28 visual.json files, found $($visualFiles.Count)." }
          foreach ($visual in $visualFiles) {
            try {
              $null = Get-Content -Raw -LiteralPath $visual.FullName | ConvertFrom-Json
            } catch {
              throw "Visual trigger gate failed: malformed visual JSON '$($visual.FullName)': $($_.Exception.Message)"
            }
          }
          Write-Host "VISUAL-TRIGGER-GATE|PASS|VisualsParsed=$($visualFiles.Count)|TablesLoaded=PASS" -ForegroundColor Green

      - name: Assert measure expression parity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/Assert-MeasureExpressionParity.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -TmdlPath "${{ github.workspace }}\BuildResult\PBIP\Pipeline_SLA_Tracker.SemanticModel\definition\tables\Fact_Pipeline_SampleData.tmdl"

      - name: Assert exact generated artifact materialization
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Assert-ArtifactMaterialization.ps1

      - name: Semantic-model KPI and slicer/filter UAT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Assert-SemanticModelUat.ps1

      - name: Verify Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "artifacts")) { throw "artifacts folder was not created." }
          Get-ChildItem artifacts -Recurse
          if (!(Test-Path "artifacts\Pipeline_SLA_Tracker.Report\.platform" -PathType Leaf)) { throw "Packaged report .platform is missing." }
          if (!(Test-Path "artifacts\Pipeline_SLA_Tracker.SemanticModel\.platform" -PathType Leaf)) { throw "Packaged semantic-model .platform is missing." }
          if (!(Test-Path "DesktopValidation\PBIP\Pipeline_SLA_Tracker.pbip" -PathType Leaf)) { throw "Desktop validation PBIP was not prepared." }

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBIP-Build
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Desktop validation tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopValidation-PBIP
          path: DesktopValidation/PBIP/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            **/*.log
            **/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
