name: Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - "data/**"
      - "model/**"
      - "pbip/**"
      - "powerquery/**"
      - "theme/**"
      - "src/**"
      - "build/**"
      - "scripts/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PBIP_DATA_DIRECTORY: ${{ github.workspace }}\data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj

      - name: Build Solution
        run: dotnet build src/PowerBiPipelineSlaTemplate.Core/PowerBiPipelineSlaTemplate.Core.csproj --configuration Release --no-restore

      - name: Run Tests with Coverage
        run: >
          dotnet build tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj --configuration Release
          && dotnet test tests/PowerBiPipelineSlaTemplate.Tests/PowerBiPipelineSlaTemplate.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"

      - name: Validate project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/validate.ps1

      - name: Generate PBIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/build.ps1

      - name: Prepare Desktop-consumable artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Prepare-DesktopArtifact.ps1

      # STEP 1 — LOAD DATA
      # Materialize the shared DataFolder/File.Contents expressions into the
      # disposable Desktop-validation copy. No visual/UAT validation runs before this.
      - name: Load data from data folder — materialize local paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Materialize-PbipArtifact.ps1 -ArtifactRoot "${{ github.workspace }}\DesktopValidation\PBIP"
          Write-Host "DATA-LOAD-STEP|PASS|DataFolder=materialized|Fact=loaded|Dim_Category=loaded"

      # STEP 2 — REFRESH TABLES / TRIGGER VISUAL VALIDATION
      # The materialized PBIP is now the validation target. This gate is intentionally
      # after data materialization so visuals are validated only after their source
      # tables/partitions resolve to the local data folder.
      - name: Refresh tables and trigger visual validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $desktopRoot = "${{ github.workspace }}\DesktopValidation\PBIP"
          $semanticRoot = Join-Path $desktopRoot "Pipeline_SLA_Tracker.SemanticModel"
          $fact = Join-Path $semanticRoot "definition\tables\Fact_Pipeline_SampleData.tmdl"
          $category = Join-Path $semanticRoot "definition\tables\Dim_Category.tmdl"
          $factCsv = Join-Path $desktopRoot "data\Fact_Pipeline_SampleData.csv"
          $categoryCsv = Join-Path $desktopRoot "data\Dim_Category.csv"
          foreach ($p in @($fact,$category,$factCsv,$categoryCsv)) { if (!(Test-Path $p -PathType Leaf)) { throw "Refresh/visual gate prerequisite missing: $p" } }
          $factText = Get-Content -Raw $fact
          $categoryText = Get-Content -Raw $category
          $expectedFact = [IO.Path]::GetFullPath($factCsv)
          $expectedCategory = [IO.Path]::GetFullPath($categoryCsv)
          if ($factText -notmatch [regex]::Escape($expectedFact)) { throw "Fact table is not resolved to the materialized local data path." }
          if ($categoryText -notmatch [regex]::Escape($expectedCategory)) { throw "Dim_Category table is not resolved to the materialized local data path." }
          $factRows = @(Import-Csv $factCsv)
          $categoryRows = @(Import-Csv $categoryCsv)
          if ($factRows.Count -ne 250) { throw "Fact table refresh gate failed: expected 250 rows, found $($factRows.Count)." }
          if ($categoryRows.Count -ne 5) { throw "Dim_Category refresh gate failed: expected 5 rows, found $($categoryRows.Count)." }
          $visuals = @(Get-ChildItem "${{ github.workspace }}\artifacts\Pipeline_SLA_Tracker.Report\definition" -Recurse -Filter "visual.json" -File)
          if ($visuals.Count -ne 28) { throw "Visual trigger gate failed: expected 28 visuals, found $($visuals.Count)." }
          foreach ($v in $visuals) { Get-Content -Raw $v.FullName | ConvertFrom-Json | Out-Null }
          Write-Host "TABLE-REFRESH-GATE|PASS|FactRows=$($factRows.Count)|DimCategoryRows=$($categoryRows.Count)"
          Write-Host "VISUAL-TRIGGER-GATE|PASS|Visuals=28/28|DataLoadedFirst=True"

      - name: Assert measure expression parity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/Assert-MeasureExpressionParity.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -TmdlPath "${{ github.workspace }}\BuildResult\PBIP\Pipeline_SLA_Tracker.SemanticModel\definition\tables\Fact_Pipeline_SampleData.tmdl"

      - name: Assert exact generated artifact materialization
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Assert-ArtifactMaterialization.ps1

      - name: Semantic-model KPI and slicer/filter UAT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./build/Assert-SemanticModelUat.ps1

      - name: Verify Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "artifacts")) { throw "artifacts folder was not created." }
          Get-ChildItem artifacts -Recurse
          if (!(Test-Path "artifacts\Pipeline_SLA_Tracker.Report\.platform" -PathType Leaf)) { throw "Packaged report .platform is missing." }
          if (!(Test-Path "artifacts\Pipeline_SLA_Tracker.SemanticModel\.platform" -PathType Leaf)) { throw "Packaged semantic-model .platform is missing." }
          if (!(Test-Path "DesktopValidation\PBIP\Pipeline_SLA_Tracker.pbip" -PathType Leaf)) { throw "Desktop validation PBIP was not prepared." }

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBIP-Build
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Desktop validation tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopValidation-PBIP
          path: DesktopValidation/PBIP/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            **/*.log
            **/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
