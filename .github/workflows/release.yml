name: Release

on:
  release:
    types:
      - published

  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate
        shell: pwsh
        run: ./build/validate.ps1

      - name: Build
        shell: pwsh
        run: ./build/build.ps1

      - name: Package PBIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/* `
            -DestinationPath PBIP-Release.zip

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PBIP-Release
          path: PBIP-Release.zip